name: Build AgentCore for Android

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'build.sh'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download Android NDK
      uses: nuwen/download-action@v2.1.0
      with:
        url: 'https://dl.google.com/android/repository/android-ndk-r27c-linux.zip'
        target: '/tmp/ndk'
        overwrite: true
      
    - name: Extract NDK
      run: |
        cd /tmp/ndk
        unzip -q android-ndk-r27c-linux.zip
        ls -la android-ndk-r27c/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android* | head -5
      
    - name: Build with NDK
      run: |
        export ANDROID_NDK_HOME=/tmp/ndk/android-ndk-r27c
        chmod +x ./build.sh
        ./build.sh release
        ls -lh bin/agentcore
        file bin/agentcore
      
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: agentcore-arm64
        path: bin/agentcore
        if-no-files-found: error
