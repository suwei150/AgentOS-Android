name: Build AgentCore for Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check compiler
        run: |
          echo "Checking available compilers..."
          which aarch64-linux-gnu-gcc && aarch64-linux-gnu-gcc --version | head -1 || echo "NOT FOUND"
          which aarch64-linux-musl-gcc && aarch64-linux-musl-gcc --version | head -1 || echo "NOT FOUND"

      - name: Install cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Compile AgentCore
        run: |
          echo "Compiling AgentCore..."
          aarch64-linux-gnu-gcc -O2 -Wall -static -o bin/agentcore src/agentcore.c
          echo "Done!"
          file bin/agentcore
          ls -lh bin/agentcore

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentcore-arm64
          path: bin/agentcore
