name: Build AgentCore for Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu musl-tools

      - name: Compile AgentCore
        run: |
          mkdir -p bin
          aarch64-linux-gnu-gcc -O2 -Wall -o bin/agentcore src/agentcore.c
          aarch64-linux-gnu-strip bin/agentcore
          echo "Result:"
          file bin/agentcore
          ls -lh bin/agentcore

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentcore-arm64
          path: bin/agentcore
