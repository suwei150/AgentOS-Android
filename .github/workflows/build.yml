name: Build AgentCore

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install aarch64 gcc
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Compile
        run: |
          mkdir -p bin
          aarch64-linux-gnu-gcc -O2 -Wall -o bin/agentcore agentcore.c
          aarch64-linux-gnu-strip bin/agentcore
          file bin/agentcore
          ls -lh bin/agentcore
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: agentcore-arm64
          path: bin/agentcore
