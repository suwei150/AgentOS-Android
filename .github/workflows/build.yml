name: Build AgentCore for Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download NDK
        run: |
          echo "Downloading NDK..."
          curl -sSL -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          echo "Unzipping NDK..."
          cd /tmp && unzip -q ndk.zip
          mv android-ndk-r27c /usr/local/ndk
          echo "Verifying NDK..."
          ls /usr/local/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android* | head -5

      - name: Compile AgentCore
        run: |
          echo "Compiling..."
          GCC=/usr/local/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-gcc
          STRIP=/usr/local/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip
          $GCC -O2 -Wall -o bin/agentcore src/agentcore.c
          $STRIP bin/agentcore
          echo "Done!"
          file bin/agentcore
          ls -lh bin/agentcore

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentcore-arm64
          path: bin/agentcore
